name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Package (macOS)
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install cmake simde

      - name: Fetch matching OBS and Qt build dependencies
        id: obs-paths
        run: |
          git clone --depth 1 --branch 30.2.3 \
            https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-studio"
          obs_dmg="$RUNNER_TEMP/obs.dmg"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-macOS-Apple.dmg \
            --output "$obs_dmg"
          printf '%s  %s\n' 6714f8fcbc8dc1f6b92ac1da58e2c7570dc65fefb819d68536375711973be0fb "$obs_dmg" | shasum -a 256 -c -
          mountpoint="$RUNNER_TEMP/obs-mount"
          hdiutil attach "$obs_dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/OBS.app" "$RUNNER_TEMP/OBS.app"
          hdiutil detach "$mountpoint"
          trap - EXIT
          echo "frameworks_dir=$RUNNER_TEMP/OBS.app/Contents/Frameworks" >> "$GITHUB_OUTPUT"

          # Use the Qt build pinned by the OBS 30.2.3 buildspec.
          qt_archive="$RUNNER_TEMP/obs-qt.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/obsproject/obs-deps/releases/download/2024-05-08/macos-deps-qt6-2024-05-08-universal.tar.xz \
            --output "$qt_archive"
          printf '%s  %s\n' 248fb342e7ddf574af0960aaedeffb832deda1485dc81583302646e979593a6e "$qt_archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/obs-qt"
          tar -xf "$qt_archive" -C "$RUNNER_TEMP/obs-qt"
          qt_config="$(find "$RUNNER_TEMP/obs-qt" -name Qt6Config.cmake -print -quit)"
          test -n "$qt_config"
          echo "qt6_dir=$(dirname "$qt_config")" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          OBS_FRAMEWORKS_DIR: ${{ steps.obs-paths.outputs.frameworks_dir }}
          QT6_DIR: ${{ steps.obs-paths.outputs.qt6_dir }}
        run: |
          cmake --preset default \
            -DOBS_INCLUDE_DIR="$RUNNER_TEMP/obs-studio/libobs" \
            -DOBS_LIBRARY="$OBS_FRAMEWORKS_DIR/libobs.framework/libobs" \
            -DOBS_SOURCE_DIR="$RUNNER_TEMP/obs-studio" \
            -DOBS_FRAMEWORKS_DIR="$OBS_FRAMEWORKS_DIR" \
            -DQt6_DIR="$QT6_DIR" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF \
            '-DCMAKE_INSTALL_RPATH=@executable_path/../Frameworks'

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
          # The host supplies OBS and Qt. Reject any build-machine dylib path.
          otool -L build/streamn-obs-scoreboard.so | awk '
            /^[[:space:]]+\// && $1 !~ /^\/(usr\/lib|System\/Library)\// {
              print "Non-portable dependency: " $1; failed = 1
            }
            END { exit failed }'
          test "$(otool -l build/streamn-obs-scoreboard.so | awk '
            /cmd LC_RPATH$/ { rpath = 1 }
            rpath && $1 == "path" { print $2; rpath = 0 }')" = '@executable_path/../Frameworks'
          bash scripts/test-macos-release-package.sh

      - name: Sign, notarize, and verify macOS installer
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_INSTALLER_SIGNING_CERT: ${{ secrets.MACOS_INSTALLER_SIGNING_CERT }}
          MACOS_INSTALLER_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_SIGNING_CERT_PASSWORD }}
          MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          bundle_version="$(plutil -extract version raw build/data/manifest.json)"
          artifact_version="$bundle_version"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            artifact_version="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/sign-macos-release-ci.sh "$bundle_version" \
            build/streamn-obs-scoreboard.so build/data/manifest.json \
            "streamn-obs-scoreboard-${artifact_version}-macos.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: streamn-obs-scoreboard-*-macos.pkg
          if-no-files-found: error

  build-linux:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Package (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build qtbase5-dev libsimde-dev \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev \
            libjansson-dev libcurl4-openssl-dev libx264-dev \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev \
            libpulse-dev libx11-xcb-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb-composite0-dev \
            libxcb-xinerama0-dev libxcomposite-dev libgl1-mesa-dev \
            swig python3-dev libavcodec-dev libavdevice-dev \
            libavfilter-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libspeexdsp-dev libmbedtls-dev \
            librist-dev libsrt-openssl-dev nlohmann-json3-dev \
            libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            uthash-dev

      - name: Clone OBS source
        run: |
          git clone --depth 1 --branch 30.2.3 \
            https://github.com/obsproject/obs-studio.git /tmp/obs-studio

      - name: Build minimal OBS (libobs + frontend API)
        run: |
          cmake -S /tmp/obs-studio -B /tmp/obs-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PLUGINS=OFF \
            -DENABLE_UI=ON \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_AJA=OFF \
            -DENABLE_BROWSER=OFF \
            -DENABLE_WEBSOCKET=OFF \
            -DENABLE_VST=OFF \
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF
          cmake --build /tmp/obs-build --target obs-frontend-api
          cmake --build /tmp/obs-build --target obs

      - name: Find OBS libraries
        id: obs-libs
        run: |
          OBS_LIB=$(find /tmp/obs-build -name "libobs.so*" -not -type l | head -1)
          FRONTEND_LIB=$(find /tmp/obs-build -name "libobs-frontend-api.so*" -not -type l | head -1)
          echo "obs_library=${OBS_LIB}" >> "$GITHUB_OUTPUT"
          echo "frontend_library=${FRONTEND_LIB}" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake --preset linux \
            -DOBS_INCLUDE_DIR=/tmp/obs-studio/libobs \
            -DOBS_LIBRARY="${{ steps.obs-libs.outputs.obs_library }}" \
            -DOBS_SOURCE_DIR=/tmp/obs-studio \
            -DOBS_FRONTEND_API_LIBRARY="${{ steps.obs-libs.outputs.frontend_library }}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGING="/tmp/tar-root/streamn-obs-scoreboard"
          mkdir -p "$STAGING/bin/64bit"
          mkdir -p "$STAGING/data"
          cp build/streamn-obs-scoreboard.so "$STAGING/bin/64bit/"
          cp build/data/manifest.json "$STAGING/data/"
          tar -czf "streamn-obs-scoreboard-${VERSION}-linux-x86_64.tar.gz" \
            -C /tmp/tar-root streamn-obs-scoreboard

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: streamn-obs-scoreboard-*-linux-x86_64.tar.gz

  build-windows:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    name: Package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'

      - name: Clone OBS source (headers only)
        run: |
          git clone --depth 1 --branch 30.2.3 `
            https://github.com/obsproject/obs-studio.git obs-source

      - name: Download OBS release and generate import libraries
        shell: pwsh
        run: |
          curl -L -o obs.zip `
            "https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip"
          Expand-Archive obs.zip -DestinationPath obs-release

          $obsDll = Get-ChildItem -Recurse -Filter "obs.dll" -Path obs-release | Select-Object -First 1
          $frontendDll = Get-ChildItem -Recurse -Filter "obs-frontend-api.dll" -Path obs-release | Select-Object -First 1

          if (-not $obsDll) { Write-Error "obs.dll not found"; exit 1 }
          if (-not $frontendDll) { Write-Error "obs-frontend-api.dll not found"; exit 1 }

          New-Item -ItemType Directory -Force -Path obs-libs | Out-Null

          $exports = & dumpbin /exports $obsDll.FullName
          $defLines = @("LIBRARY `"obs.dll`"", "EXPORTS")
          foreach ($line in $exports) {
            if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
              $defLines += "    $($Matches[1])"
            }
          }
          $defLines | Out-File -Encoding ASCII "obs-libs/obs.def"
          & lib /def:obs-libs/obs.def /out:obs-libs/obs.lib /machine:x64

          $exports = & dumpbin /exports $frontendDll.FullName
          $defLines = @("LIBRARY `"obs-frontend-api.dll`"", "EXPORTS")
          foreach ($line in $exports) {
            if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
              $defLines += "    $($Matches[1])"
            }
          }
          $defLines | Out-File -Encoding ASCII "obs-libs/obs-frontend-api.def"
          & lib /def:obs-libs/obs-frontend-api.def /out:obs-libs/obs-frontend-api.lib /machine:x64

          Get-ChildItem obs-libs/*.lib

      - name: Configure
        run: |
          cmake --preset windows `
            -DOBS_INCLUDE_DIR="obs-source/libobs" `
            -DOBS_LIBRARY="obs-libs/obs.lib" `
            -DOBS_SOURCE_DIR="obs-source" `
            -DOBS_FRONTEND_API_LIBRARY="obs-libs/obs-frontend-api.lib"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Code sign (optional)
        if: env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx",
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
            sign /f cert.pfx /p $env:WINDOWS_SIGNING_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            build/RelWithDebInfo/streamn-obs-scoreboard.dll
          Remove-Item cert.pfx

      - name: Package .zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $binDir = "pkg-root/streamn-obs-scoreboard/bin/64bit"
          $dataDir = "pkg-root/streamn-obs-scoreboard/data"
          New-Item -ItemType Directory -Force -Path $binDir
          New-Item -ItemType Directory -Force -Path $dataDir
          Copy-Item "build/RelWithDebInfo/streamn-obs-scoreboard.dll" $binDir
          Copy-Item "build/data/manifest.json" $dataDir
          Compress-Archive -Path "pkg-root/streamn-obs-scoreboard" `
            -DestinationPath "streamn-obs-scoreboard-${version}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: streamn-obs-scoreboard-*-windows-x64.zip

  create-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    name: Create Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*
