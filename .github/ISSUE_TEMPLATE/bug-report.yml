name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! The more detail you can provide, the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong.
      placeholder: "e.g., The clock keeps running after I click Stop"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? List the steps if you can.
      placeholder: |
        1. Open OBS
        2. Start a game
        3. ...

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      placeholder: "e.g., 31.0.2"

  - type: input
    id: plugin-version
    attributes:
      label: Streamn Scoreboard version
      placeholder: "e.g., v0.7.0"

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
